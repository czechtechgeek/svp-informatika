site_name: Digitální kniha Informatiky - ŠVP
site_description: Komplexní Školní vzdělávací program pro informatiku na 2. stupni (6. - 9. ročník)
theme:
  name: material
  language: cs
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - toc.integrate
  palette:
    - scheme: default
      primary: teal
      accent: deep orange

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables

