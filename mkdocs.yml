site_name: Digitální kniha Informatiky - ŠVP
site_description: Komplexní Školní vzdělávací program pro informatiku na 2. stupni (6. - 9. ročník)
theme:
  name: material
  language: cs
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - content.code.copy
    - toc.integrate
    - content.action.edit
  icon:
    repo: fontawesome/brands/github-alt 
    edit: material/pencil 
    view: material/eye
    
  palette:
    - scheme: default
      primary: teal
      accent: deep orange

edit_uri: edit/main/docs/
repo_url: https://github.com/czechtechgeek/svp-informatika
repo_name: czechtechgeek/svp-informatika

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables

